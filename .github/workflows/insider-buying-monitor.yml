name: Insider Buying Monitor

on:
  schedule:
    # 9:00 AM ET (14:00 UTC) every weekday — adjust if your team is in a different timezone
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override date to check (YYYY-MM-DD). Leave blank for previous business day."
        required: false
        default: ""

jobs:
  run-monitor:
    name: Fetch EDGAR filings & post to Slack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run insider buying monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: npx tsx scripts/insider-buying-monitor.ts
